<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balu der Bär Stimmen-Konverter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="bear">
        <div class="bear-ear bear-ear-left"></div>
        <div class="bear-ear bear-ear-right"></div>
        <div class="bear-head"></div>
        <div class="bear-snout"></div>
      </div>
      <h1>Balu der Bär<br>Stimmen-Konverter</h1>
    </header>

    <main>
      <section class="record-zone">
        <button id="btn-record" class="btn-record" aria-label="Aufnahme starten">
          <span class="btn-icon">&#9679;</span>
          <span class="btn-label">Aufnahme starten</span>
        </button>
        <div id="timer-display" class="timer" aria-live="polite">00:00</div>
        <div id="status-text" class="status" aria-live="polite">Klicke auf den Button und sprich!</div>
      </section>

      <div id="spinner-overlay" class="spinner-overlay hidden" aria-hidden="true">
        <div class="spinner"></div>
        <p>Balu brummt...</p>
      </div>

      <section id="result-zone" class="result-zone hidden">
        <div class="players">
          <div class="player-card">
            <h2>Original</h2>
            <audio id="audio-original" controls></audio>
          </div>
          <div class="divider">&#8594;</div>
          <div class="player-card balu-card">
            <h2>&#127867; Balu der Bär</h2>
            <audio id="audio-mickey" controls></audio>
          </div>
        </div>
        <a id="btn-download" class="btn-download" download="balu-stimme.wav">
          &#11123; Balu-Stimme herunterladen
        </a>
        <button id="btn-again" class="btn-again">Neue Aufnahme</button>
      </section>
    </main>

    <footer>
      <p>Probier's aus — Balu macht den Rest! &#128058;</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <script src="audio-processor.js"></script>
  <script src="app.js"></script>
</body>
</html>
